<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>寶可夢數學習魔術：倍數與因數大挑戰</title>
  <style>
    :root {
      --bg-color: #f0f8ff;
      --card-bg: #ffffff;
      --primary: #ffcb05;
      --secondary: #2a75bb;
      --accent: #ff0000;
      --text: #222222;
      --success: #28a745;
      --danger: #dc3545;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang HK", "Microsoft JhengHei", sans-serif;
      background-color: #1e3c72;
      background-image: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .game-container {
      background: var(--card-bg);
      border: 6px solid var(--primary);
      border-radius: 24px;
      width: 100%;
      max-width: 850px;
      padding: 24px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    /* 頂部資訊欄 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #eef5fc;
      padding: 12px 20px;
      border-radius: 16px;
      border: 3px solid var(--secondary);
    }

    .badge {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pokeballs {
      font-size: 1.6rem;
      letter-spacing: 4px;
    }

    /* 角色與問題區 */
    .question-card {
      background: #fff9e6;
      border: 4px dashed var(--primary);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .avatar-area {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    /* 動態寶可夢動畫效果 */
    .poke-img {
      width: 110px;
      height: 110px;
      object-fit: contain;
      filter: drop-shadow(2px 6px 8px rgba(0,0,0,0.25));
      animation: pokeFloat 2.5s ease-in-out infinite;
    }

    @keyframes pokeFloat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-10px) scale(1.03); }
    }

    /* 答對收服動畫 */
    .poke-captured {
      animation: captureAnim 0.6s ease-in-out forwards !important;
    }

    @keyframes captureAnim {
      0% { transform: scale(1) rotate(0deg); }
      20% { transform: scale(1.3) rotate(-10deg); }
      40% { transform: scale(0.8) rotate(10deg); }
      60% { transform: scale(1.1) rotate(-5deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    /* 答錯逃跑動畫 */
    .poke-fled {
      animation: fleeAnim 0.5s ease-in-out forwards !important;
    }

    @keyframes fleeAnim {
      0% { transform: translateX(0); }
      25% { transform: translateX(-15px); }
      50% { transform: translateX(15px); }
      75% { transform: translateX(-10px); }
      100% { transform: translateX(0); opacity: 0.6; }
    }

    .speech-bubble {
      background: white;
      border: 3px solid var(--secondary);
      border-radius: 16px;
      padding: 10px 18px;
      font-size: 1.4rem;
      font-weight: bold;
      color: #000;
      position: relative;
      box-shadow: 2px 4px 10px rgba(0,0,0,0.1);
    }

    .q-text {
      font-size: 1.8rem;
      font-weight: 800;
      color: #111;
      line-height: 1.5;
      margin: 8px 0;
    }

    /* 選項按鈕區 */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-top: 8px;
    }

    .btn-option {
      background: var(--secondary);
      color: white;
      border: none;
      border-bottom: 6px solid #1a4975;
      border-radius: 18px;
      font-size: 1.8rem;
      font-weight: bold;
      padding: 20px 10px;
      cursor: pointer;
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 85px;
    }

    .btn-option:active, .btn-option.active {
      transform: translateY(4px);
      border-bottom-width: 2px;
    }

    /* 回饋／教學解析視窗 */
    .feedback-modal {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.88);
      border-radius: 18px;
      padding: 20px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 100;
      color: white;
      animation: fadeIn 0.2s ease-in-out;
    }

    .feedback-title {
      font-size: 2.2rem;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .feedback-steps {
      background: #ffffff;
      color: #222;
      border-radius: 16px;
      padding: 18px;
      font-size: 1.35rem;
      text-align: left;
      width: 95%;
      max-width: 650px;
      line-height: 1.6;
      border: 4px solid var(--primary);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .btn-next {
      margin-top: 18px;
      background: var(--primary);
      color: #000;
      border: none;
      border-radius: 14px;
      font-size: 1.8rem;
      font-weight: bold;
      padding: 14px 40px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* 設定／開始畫面 */
    .start-screen, .end-screen {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 20px;
    }

    .main-title {
      font-size: 2.4rem;
      color: var(--secondary);
      font-weight: 900;
      text-shadow: 2px 2px 0px var(--primary);
      margin: 0;
    }

    .mode-select {
      display: flex;
      gap: 20px;
      margin: 15px 0;
    }

    .btn-mode {
      background: #e0e0e0;
      border: 4px solid #aaa;
      border-radius: 16px;
      padding: 15px 30px;
      font-size: 1.5rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-mode.selected {
      background: var(--primary);
      border-color: var(--secondary);
      color: #000;
    }

    .btn-start {
      background: var(--success);
      color: white;
      border: none;
      border-bottom: 6px solid #1e7e34;
      border-radius: 20px;
      font-size: 2rem;
      font-weight: bold;
      padding: 16px 50px;
      cursor: pointer;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

<div class="game-container">
  
  <!-- 1. 開始畫面 -->
  <div id="start-screen" class="start-screen">
    <h1 class="main-title">⚡ 寶可夢倍數與因數大冒險 ⚡</h1>
    <img class="poke-img" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/25.gif" alt="皮卡丘" style="width: 140px; height: 140px;">
    
    <p style="font-size: 1.5rem; font-weight: bold; color: #444; margin: 0;">請選擇訓練家挑戰難度：</p>
    <div class="mode-select">
      <button class="btn-mode selected" id="mode-easy" onclick="selectMode('easy')">🟢 練習模式<br><span style="font-size:1.1rem; font-weight:normal;">(數字較小、基本題)</span></button>
      <button class="btn-mode" id="mode-hard" onclick="selectMode('hard')">🔴 挑戰模式<br><span style="font-size:1.1rem; font-weight:normal;">(數字較大、思考題)</span></button>
    </div>

    <button class="btn-start" onclick="startGame()">⚡ 開始冒險 ⚡</button>
  </div>

  <!-- 2. 遊戲主畫面 -->
  <div id="game-screen" style="display: none; flex-direction: column; gap: 16px;">
    <div class="header">
      <div class="badge">📌 題目：<span id="q-progress">1/10</span></div>
      <div class="badge">🔴 寶可球：<span id="hearts-display" class="pokeballs">🔴🔴🔴</span></div>
      <div class="badge">⭐ 收服數：<span id="caught-display">0</span></div>
    </div>

    <div class="question-card">
      <div class="avatar-area">
        <img id="poke-avatar" class="poke-img" src="" alt="寶可夢">
        <div class="speech-bubble" id="poke-dialog">皮卡！訓練家請聽題！</div>
      </div>
      <div class="q-text" id="question-text">載入中...</div>
    </div>

    <div class="options-grid" id="options-container">
      <!-- 動態生成 4 個選項按鈕 -->
    </div>
  </div>

  <!-- 3. 解析與反饋視窗 -->
  <div id="feedback-modal" class="feedback-modal">
    <div id="feedback-title" class="feedback-title">Correct!</div>
    <div class="feedback-steps" id="feedback-steps">
      <!-- 顯示步驟教學 -->
    </div>
    <button class="btn-next" id="btn-next-q" onclick="nextQuestion()">下一題 ➔</button>
  </div>

  <!-- 4. 結算畫面 -->
  <div id="end-screen" class="end-screen" style="display: none;">
    <h1 class="main-title" id="end-title">冒險完成！</h1>
    <img id="end-img" class="poke-img" src="" alt="結算圖案" style="width: 140px; height: 140px;">
    <div style="font-size: 2rem; font-weight: bold;" id="end-score-text">總得分：0 分</div>
    <p style="font-size: 1.4rem; color: #555;" id="end-comment">太棒了！你完全掌握了倍數與因數！</p>
    <button class="btn-start" onclick="restartGame()">🔄 再玩一次</button>
  </div>

</div>

<script>
  let currentMode = 'easy';
  let currentQIndex = 0;
  let score = 0;
  let caughtCount = 0;
  let lives = 3;
  let questions = [];
  const TOTAL_QUESTIONS = 10;

  // 音效系統 (Web Audio API)
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'correct') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
      osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
      osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
    } else if (type === 'wrong') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, audioCtx.currentTime);
      osc.frequency.setValueAtTime(160, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.35);
    } else if (type === 'click') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(400, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }
  }

  // 動態 GIF 寶可夢陣容 (Showdown / Gen 5 官方動態圖片)
  const pokemons = [
    { name: "皮卡丘", move: "十萬伏特", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/25.gif" },
    { name: "小火龍", move: "噴射火焰", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/4.gif" },
    { name: "傑尼龜", move: "水槍", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/7.gif" },
    { name: "妙蛙種子", move: "藤鞭", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/1.gif" },
    { name: "伊布", move: "高速星星", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/133.gif" },
    { name: "卡比獸", move: "泰山壓頂", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/143.gif" },
    { name: "耿鬼", move: "影子球", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/94.gif" },
    { name: "胖丁", move: "唱歌", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/39.gif" },
    { name: "可達鴨", move: "念力", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/54.gif" },
    { name: "超夢", move: "精神強念", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/150.gif" }
  ];

  function selectMode(mode) {
    playSound('click');
    currentMode = mode;
    document.getElementById('mode-easy').classList.toggle('selected', mode === 'easy');
    document.getElementById('mode-hard').classList.toggle('selected', mode === 'hard');
  }

  function getFactors(n) {
    let factors = [];
    for (let i = 1; i <= n; i++) {
      if (n % i === 0) factors.push(i);
    }
    return factors;
  }

  function generateQuestions() {
    let qList = [];
    for (let i = 0; i < TOTAL_QUESTIONS; i++) {
      const poke = pokemons[i % pokemons.length];
      const isFactorQ = Math.random() < 0.5;
      
      if (!isFactorQ) {
        // --- 倍數情境題 ---
        let base = currentMode === 'easy' ? Math.floor(Math.random() * 6) + 3 : Math.floor(Math.random() * 9) + 5;
        let multiplier = Math.floor(Math.random() * 7) + 2;
        let correctAns = base * multiplier;

        let options = new Set([correctAns]);
        while(options.size < 4) {
          let wrong = correctAns + (Math.floor(Math.random() * 5) - 2) * base + Math.floor(Math.random() * 5) + 1;
          if (wrong > 0 && wrong !== correctAns) options.add(wrong);
        }

        let optArray = Array.from(options).sort(() => Math.random() - 0.5);

        const contexts = [
          `<b>${poke.name}</b> 每次使用『${poke.move}』會消耗 <span style="color:#2a75bb;">${base}</span> 點體力。請選出累積消耗體力可能的<b>倍數</b>？`,
          `<b>${poke.name}</b> 採集樹果，每箱裝 <span style="color:#2a75bb;">${base}</span> 顆。下列哪一個數字可能是總樹果量（<b>${base} 的倍數</b>）？`,
          `訓練家給 <b>${poke.name}</b> 餵食能量糖果，每次給 <span style="color:#2a75bb;">${base}</span> 顆。下列哪一個數是 <b>${base} 的倍數</b>？`
        ];
        const qText = contexts[Math.floor(Math.random() * contexts.length)];

        qList.push({
          type: 'multiple',
          poke: poke,
          text: qText,
          options: optArray,
          correct: correctAns,
          steps: `💡 <b>訓練家解題步驟：</b><br>` +
                 `1. 檢查數字能否被 ${base} 整除。<br>` +
                 `2. 因為 <b>${correctAns} ÷ ${base} = ${multiplier}</b>（剛好整除，沒有餘數）！<br>` +
                 `3. 所以 <b>${correctAns}</b> 是 ${base} 的倍數！`
        });

      } else {
        // --- 因數情境題 ---
        let target = currentMode === 'easy' ? [12, 16, 18, 20, 24, 30][Math.floor(Math.random() * 6)] : [36, 40, 42, 45, 48, 60, 72][Math.floor(Math.random() * 7)];
        let allFactors = getFactors(target);
        let askIsFactor = Math.random() < 0.7;
        
        if (askIsFactor) {
          let correctAns = allFactors[Math.floor(Math.random() * (allFactors.length - 1)) + 1];
          let options = new Set([correctAns]);
          while(options.size < 4) {
            let wrong = Math.floor(Math.random() * (target - 2)) + 2;
            if (!allFactors.includes(wrong)) options.add(wrong);
          }
          let optArray = Array.from(options).sort(() => Math.random() - 0.5);

          const factorContexts = [
            `<b>${poke.name}</b> 撿到了 <span style="color:#2a75bb;">${target}</span> 顆樹果，想平均分給隊友且不留餘數。下列哪一個數量是 <b>${target} 的因數</b>？`,
            `訓練家想把 <span style="color:#2a75bb;">${target}</span> 個寶可球平分到盒子裡。下列哪一個數是 <b>${target} 的因數</b>？`
          ];

          qList.push({
            type: 'factor',
            poke: poke,
            text: factorContexts[Math.floor(Math.random() * factorContexts.length)],
            options: optArray,
            correct: correctAns,
            steps: `💡 <b>訓練家解題步驟：</b><br>` +
                   `1. 找出 ${target} 的所有因數對：<br>` +
                   `   ${allFactors.map(f => `${f} ×${target/f}`).slice(0, Math.ceil(allFactors.length/2)).join('， ')}<br>` +
                   `2. ${target} 的完整因數：<b>${allFactors.join(', ')}</b>。<br>` +
                   `3. 因此 <b>${correctAns}</b> 可以整除 ${target}，是它的因數！`
          });
        } else {
          let correctAns;
          do {
            correctAns = Math.floor(Math.random() * (target - 2)) + 2;
          } while(allFactors.includes(correctAns));

          let wrongSet = new Set([correctAns]);
          while(wrongSet.size < 4) {
            let f = allFactors[Math.floor(Math.random() * allFactors.length)];
            wrongSet.add(f);
          }
          let optArray = Array.from(wrongSet).sort(() => Math.random() - 0.5);

          let quot = Math.floor(target / correctAns);
          let rem = target % correctAns;

          qList.push({
            type: 'not-factor',
            poke: poke,
            text: `隊長想把 <span style="color:#2a75bb;">${target}</span> 個獎章平均分給隊員。下列哪一個數量 <span style="color:#ff0000;">不可以整除</span>（<b>不是 ${target} 的因數</b>）？`,
            options: optArray,
            correct: correctAns,
            steps: `💡 <b>訓練家解題步驟：</b><br>` +
                   `1. 測試計算：<b>${target} ÷ ${correctAns} = ${quot} 餘 ${rem}</b>。<br>` +
                   `2. 因為有餘數、不能平分整除，所以 <b>${correctAns}</b> <span style="color:red;">不是</span> ${target} 的因數！`
          });
        }
      }
    }
    return qList;
  }

  function startGame() {
    playSound('click');
    score = 0;
    caughtCount = 0;
    lives = 3;
    currentQIndex = 0;
    questions = generateQuestions();

    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('end-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'flex';

    updateHeader();
    renderQuestion();
  }

  function updateHeader() {
    document.getElementById('q-progress').innerText = `${currentQIndex + 1}/${TOTAL_QUESTIONS}`;
    document.getElementById('caught-display').innerText = caughtCount;
    
    let ballStr = '';
    for(let i = 0; i < 3; i++) {
      ballStr += (i < lives) ? '🔴' : '⚪';
    }
    document.getElementById('hearts-display').innerText = ballStr;
  }

  function renderQuestion() {
    const q = questions[currentQIndex];
    const pokeImg = document.getElementById('poke-avatar');

    // 清除舊動畫 class
    pokeImg.classList.remove('poke-captured', 'poke-fled');
    pokeImg.src = q.poke.img;

    document.getElementById('poke-dialog').innerText = `${q.poke.name} 使用了『${q.poke.move}』！發出了挑戰：`;
    document.getElementById('question-text').innerHTML = q.text;

    const optContainer = document.getElementById('options-container');
    optContainer.innerHTML = '';

    q.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'btn-option';
      btn.innerHTML = `<span>(${idx + 1})</span> <b>${opt}</b>`;
      btn.onclick = () => checkAnswer(opt);
      optContainer.appendChild(btn);
    });

    document.onkeydown = (e) => {
      if (['1', '2', '3', '4'].includes(e.key)) {
        const index = parseInt(e.key) - 1;
        if (q.options[index] !== undefined) {
          checkAnswer(q.options[index]);
        }
      }
    };
  }

  function checkAnswer(selectedOpt) {
    document.onkeydown = null;
    const q = questions[currentQIndex];
    const isCorrect = selectedOpt === q.correct;
    const pokeImg = document.getElementById('poke-avatar');

    const modal = document.getElementById('feedback-modal');
    const title = document.getElementById('feedback-title');
    const steps = document.getElementById('feedback-steps');

    if (isCorrect) {
      playSound('correct');
      score += 10;
      caughtCount++;
      pokeImg.classList.add('poke-captured'); // 觸發收服動態
      title.innerHTML = `🎉 效果絕佳！成功收服 ${q.poke.name}！`;
      title.style.color = '#ffcb05';
      steps.innerHTML = `🌟 <b>完美解答！獲得 10 分！</b><br><br>` + q.steps;
    } else {
      playSound('wrong');
      lives--;
      pokeImg.classList.add('poke-fled'); // 觸發逃跑動態
      title.innerHTML = `💥 糟糕！${q.poke.name} 逃走了！`;
      title.style.color = '#ff4d4d';
      steps.innerHTML = `⚠️ <b>正確答案是：<span style="color:#2a75bb; font-size:1.6rem;">${q.correct}</span></b><br><br>` + q.steps;
    }

    updateHeader();
    modal.style.display = 'flex';
  }

  function nextQuestion() {
    playSound('click');
    document.getElementById('feedback-modal').style.display = 'none';

    if (lives <= 0 || currentQIndex >= TOTAL_QUESTIONS - 1) {
      endGame();
    } else {
      currentQIndex++;
      updateHeader();
      renderQuestion();
    }
  }

  function endGame() {
    document.getElementById('game-screen').style.display = 'none';
    const endScreen = document.getElementById('end-screen');
    endScreen.style.display = 'flex';

    const endTitle = document.getElementById('end-title');
    const endImg = document.getElementById('end-img');
    const endScoreText = document.getElementById('end-score-text');
    const endComment = document.getElementById('end-comment');

    endScoreText.innerText = `總得分：${score} 分 │ 共收服 ${caughtCount} 隻寶可夢`;

    if (lives > 0 && score >= 80) {
      endTitle.innerText = '🏆 大獲全勝！頂級寶可夢大師！';
      endImg.src = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/6.gif"; // 動態噴火龍
      endComment.innerText = '太厲害了！你完美的數學能力成功收服了傳說寶可夢！';
    } else if (lives > 0) {
      endTitle.innerText = '👍 冒險成功！優秀的訓練家！';
      endImg.src = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/25.gif"; // 動態皮卡丘
      endComment.innerText = '做得好！繼續練習，你一定能成為滿分大師！';
    } else {
      endTitle.innerText = '💪 不要放棄！再戰一次！';
      endImg.src = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/54.gif"; // 動態可達鴨
      endComment.innerText = '寶可球用光了！仔細看看解題步驟，重新出發吧！';
    }
  }

  function restartGame() {
    playSound('click');
    document.getElementById('end-screen').style.display = 'none';
    document.getElementById('start-screen').style.display = 'flex';
  }
</script>
</body>
</html>
